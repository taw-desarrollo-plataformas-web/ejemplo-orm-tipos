services:
  postgres:
    image: postgres:16
    container_name: orm_postgres
    environment:
      POSTGRES_DB: orm_demo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  mariadb:
    image: mariadb:11
    container_name: orm_mariadb
    environment:
      MARIADB_DATABASE: orm_demo
      MARIADB_USER: user
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql
